name: Lab 9 - Failure Tests and Recovery

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  failure-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required project files
        run: |
          test -f train.csv
          test -f test.csv
          test -f config.yaml

      - name: Test missing-file failure handling
        run: |
          python -c "from pathlib import Path; p=Path('missing_test_file.csv'); assert not p.exists(), 'Test file unexpectedly exists'; print('PASS: Missing file detected')"

      - name: Test invalid data handling
        run: |
          python -c "import pandas as pd; from pathlib import Path; p=Path('failure_test.csv'); pd.DataFrame({'wrong_column':[1,2]}).to_csv(p,index=False); d=pd.read_csv(p); assert 'satisfaction' not in d.columns; print('PASS: Invalid schema detected'); p.unlink()"

      - name: Verify normal pipeline
        run: |
          python src/mlops/churn_prediction_pipeline.py